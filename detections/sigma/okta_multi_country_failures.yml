title: Okta Failed Sign-ins from Three or More Countries (single event)
id: b7070d2e-e303-59ef-b679-e85a8fca5c2d
status: experimental
description: 'Base rule: one matching event. On its own this is normal; the correlation
  below counts them.'
references:
- https://github.com/Drakeion2532/identity-risk-engine
- https://attack.mitre.org/techniques/T1110/004/
author: Shubhan Punde
date: 2026-11-24
tags:
- attack.credential-access
- attack.t1110.004
logsource:
  product: okta
  service: okta
name: okta_evt_multi_country_failures
detection:
  selection:
    eventtype: user.session.start
    outcome.result: FAILURE
  condition: selection
level: informational
---
title: Okta Failed Sign-ins from Three or More Countries
id: 8a3f5c17-9e24-4b6d-a1c0-7d5e2f8b4c03
status: experimental
description: 'Detects failed Okta sign-ins for one account coming from three or more
  countries within ten

  minutes, typical of credential stuffing through distributed proxies.

  Mirrors the engine''s "multi_country_failures" signal.

  '
references:
- https://github.com/Drakeion2532/identity-risk-engine
- https://attack.mitre.org/techniques/T1110/004/
author: Shubhan Punde
date: 2026-11-24
tags:
- attack.credential-access
- attack.t1110.004
correlation:
  type: value_count
  rules:
  - okta_evt_multi_country_failures
  group-by:
  - actor.alternateid
  timespan: 10m
  condition:
    field: client.geographicalcontext.country
    gte: 3
falsepositives:
- Corporate VPN egress points in several countries
level: high
