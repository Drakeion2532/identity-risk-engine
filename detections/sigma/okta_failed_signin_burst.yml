title: Okta Burst of Failed Sign-ins for One User (single event)
id: b7268dfe-33b7-53b9-b545-380ef4cdb67d
status: experimental
description: 'Base rule: one matching event. On its own this is normal; the correlation
  below counts them.'
references:
- https://github.com/Drakeion2532/identity-risk-engine
- https://attack.mitre.org/techniques/T1110/001/
author: Shubhan Punde
date: 2026-11-24
tags:
- attack.credential-access
- attack.t1110.001
logsource:
  product: okta
  service: okta
name: okta_evt_failed_signin_burst
detection:
  selection:
    eventtype: user.session.start
    outcome.result: FAILURE
  condition: selection
level: informational
---
title: Okta Burst of Failed Sign-ins for One User
id: 0c9e7b42-5a61-4f0b-8f6d-3e2c1b9a7d02
status: experimental
description: 'Detects six or more failed Okta sign-ins for the same account within
  ten minutes.

  Mirrors the engine''s "brute_force" signal.

  '
references:
- https://github.com/Drakeion2532/identity-risk-engine
- https://attack.mitre.org/techniques/T1110/001/
author: Shubhan Punde
date: 2026-11-24
tags:
- attack.credential-access
- attack.t1110.001
correlation:
  type: event_count
  rules:
  - okta_evt_failed_signin_burst
  group-by:
  - actor.alternateid
  timespan: 10m
  condition:
    gte: 6
falsepositives:
- A user who forgot a recently changed password
level: medium
